<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterTrack — Your all-in-one track calculator</title>
  <meta name="description" content="BetterTrack is a free iPhone and iPad track calculator. Your all-in-one track calculator.">
  <meta name="author" content="Miguel Macias">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://bettertrackapp.com/">
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="icon.jpg">

  <meta property="og:title" content="BetterTrack — Your all-in-one track calculator">
  <meta property="og:description" content="BetterTrack is a free iPhone and iPad track calculator.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bettertrackapp.com/">
  <meta property="og:site_name" content="BetterTrack">
  <meta property="og:image" content="https://bettertrackapp.com/icon.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="BetterTrack — Your all-in-one track calculator">
  <meta name="twitter:description" content="BetterTrack is a free iPhone and iPad track calculator.">
  <meta name="twitter:image" content="https://bettertrackapp.com/icon.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --muted: #b7b3c2;
      --font: "Ubuntu", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      flex: 1;
      width: min(420px, calc(100% - 40px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 0 16px;
    }

    .logo {
      width: min(240px, 68vw);
      height: auto;
      display: block;
    }

    h1 {
      margin: 4px 0 0;
      font-size: clamp(2.5rem, 10vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.4;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(320px, 100%);
      min-height: 54px;
      margin-top: 28px;
      padding: 12px 22px;
      border-radius: 999px;
      background: linear-gradient(100deg, #6d5efc 0%, #8b5cf6 55%, #c084fc 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(109, 94, 252, 0.35);
    }

    .cta:hover { filter: brightness(1.08); }

    .cta-secondary {
      margin-top: 12px;
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.38);
      box-shadow: none;
    }

    .cta-secondary:hover {
      filter: none;
      background: rgba(255, 255, 255, 0.08);
    }

    .cta:focus-visible,
    .footer a:focus-visible {
      outline: 3px solid #ddd6fe;
      outline-offset: 3px;
    }

    .footer {
      padding: 8px 20px 28px;
    }

    .footer nav {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .footer a {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 400;
      text-decoration: none;
      padding: 10px 4px;
    }

    .footer a:hover { color: #fff; text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 360px) {
      h1 { font-size: 2.25rem; }
      .subtitle { font-size: 0.98rem; }
      .cta { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <img class="logo" src="icon.jpg" alt="" width="635" height="635">
      <h1>BetterTrack</h1>
      <p class="subtitle">Your all-in-one track calculator</p>
      <a class="cta" href="https://apps.apple.com/us/app/bettertrack/id6798806026">Download on the App Store</a>
      <a class="cta cta-secondary" href="/app/">Open online version</a>
    </main>
    <footer class="footer">
      <nav aria-label="Footer">
        <a href="privacy.html">Privacy</a>
        <a href="support.html">Support</a>
      </nav>
    </footer>
  </div>
</body>
</html>
